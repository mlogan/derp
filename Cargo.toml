# DERP: Deterministic Execution and Replay Platform. The rewriter and
# launcher (this crate, the `derp` binary) and the supervisor dylib
# (`supervisor/`) that runs inside every guest.
[package]
name = "rewrite"
version = "0.1.0"
edition = "2021"
description = "Rewrites aarch64 Mach-O executables to hook branches and memory accesses, and launches them under a deterministic scheduler"

[[bin]]
name = "derp"
path = "src/main.rs"

[dependencies]
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"

[lints]
workspace = true

[workspace]
members = [".", "supervisor"]

[workspace.lints.rust]
unsafe_code = "allow"

[workspace.lints.clippy]
# Lint groups at lower priority so that single lints can override them
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
cast_lossless = "allow"
cast_possible_wrap = "allow"
similar_names = "allow"
too_many_lines = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"
must_use_candidate = "allow"
struct_excessive_bools = "allow"
fn_params_excessive_bools = "allow"
if_not_else = "allow"
match_same_arms = "allow"
inline_always = "allow"
return_self_not_must_use = "allow"
needless_pass_by_value = "allow"
checked_conversions = "allow"
