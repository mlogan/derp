[package]
name = "rewrite"
version = "0.1.0"
edition = "2021"
description = "Rewrites aarch64 Mach-O executables to hook branches and memory accesses, and launches them under a deterministic scheduler"

[dependencies]
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"

[lints]
workspace = true
