# A PostgreSQL server on one host and a Python client on another, running
# a CRUD workload from several threads. First `./setup.sh` (initdb, once)
# and a venv with pg8000 (see ../README.md), then
#   rewrite run --manifest examples/postgres/run.yaml --capture
seed: 1
env: { PYTHONPATH: site-packages }   # the venv's, copied into the client's host directory
hosts:
  - name: db
    files: [data]
    processes:
      - argv: [/opt/homebrew/opt/postgresql@17/bin/postgres, -D, data,
               -c, listen_addresses=0.0.0.0, -c, unix_socket_directories=,
               -c, log_min_messages=warning, -c, max_connections=20]
        daemon: true
  - name: client
    files: [client.py, ../.venv/lib/python3.13/site-packages]
    processes:
      - [/opt/homebrew/opt/python@3.13/bin/python3.13, -u, client.py]
